name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Copy Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Verify Gradle Installation
        run: gradle --version

      - name: Build Android Debug APK
        run: |
          cd android
          gradle clean
          gradle assembleDebug --stacktrace

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
