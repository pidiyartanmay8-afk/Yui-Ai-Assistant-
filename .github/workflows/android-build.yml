name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install Project Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Verify Capacitor CLI
        run: |
          npx cap --version

      - name: Build Web Application
        run: |
          npm run build

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Create Android Project If Missing
        shell: bash
        run: |
          echo "Checking Android project..."

          if [ ! -f "android/gradlew" ]; then
            echo "Android project is missing."
            echo "Creating Android project with Capacitor..."

            if [ -d "android" ]; then
              echo "Removing incomplete Android directory..."
              rm -rf android
            fi

            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Verify Android Project
        shell: bash
        run: |
          echo "Verifying Android project..."

          test -d android
          test -f android/gradlew
          test -d android/app

          echo "Android project is ready."

          echo "Android directory:"
          ls -la android

          echo "Android app directory:"
          ls -la android/app

      - name: Grant Gradle Execute Permission
        run: |
          chmod +x android/gradlew

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Verify Capacitor Android
        run: |
          test -d android/app
          test -f android/gradlew

          echo "Capacitor Android sync completed successfully."

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify Generated APK
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "Checking for generated APK..."

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching for APK files..."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK_PATH"

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: yui-ai-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
