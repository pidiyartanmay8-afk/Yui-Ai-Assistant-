name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android Project
        run: |
          echo "Checking Android directory..."
          ls -la
          echo "Checking android directory..."
          ls -la android || true
          echo "Checking android/app directory..."
          ls -la android/app || true
          echo "Checking android/app/src directory..."
          ls -la android/app/src || true
          echo "Checking android/app/src/main directory..."
          ls -la android/app/src/main || true

      - name: Grant Gradle Execute Permission
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "ERROR: android/gradlew was not found."
            echo "Android Gradle project is incomplete."
            exit 1
          fi

      - name: Upload Generated APK
        uses: actions/upload-artifact@v4
        with:
          name: yui-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
