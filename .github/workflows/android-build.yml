name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Copy Web Assets to Capacitor Android
        run: npx @capacitor/cli copy android || npx cap copy android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK & Gradle
        uses: android-actions/setup-android@v3

      - name: Build Android Debug APK
        run: |
          cd android
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.7 || true
            if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && [ -f "./gradlew" ]; then
              chmod +x gradlew
              ./gradlew :app:assembleDebug --stacktrace
            else
              gradle :app:assembleDebug --stacktrace
            fi
          fi

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
