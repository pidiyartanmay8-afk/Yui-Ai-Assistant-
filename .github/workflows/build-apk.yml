name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fix Tailwind Native Binding & Install
        run: |
          rm -rf node_modules package-lock.json
          npm install --include=optional --os=linux --cpu=x64
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm rebuild

      - name: Build Web App
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
          VITE_GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          VITE_LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run build

      - name: Initialize & Setup Android Platform
        run: |
          BUILD_DIR="dist"
          if [ -d "build" ]; then BUILD_DIR="build"; fi
          if [ -d "out" ]; then BUILD_DIR="out"; fi
          
          npx cap init "Yui Assistant" "com.yui.app" --web-dir $BUILD_DIR || true
          npx cap add android
          npx cap sync android
                  # Inject Microphone Permissions into AndroidManifest.xml
        sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

         # Fix Kotlin duplicate stdlib dependencies
          cat >> android/app/build.gradle <<'EOF'

          configurations.all {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
          }
          EOF
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yui-Assistant-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
